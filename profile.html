<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | CampusHire AI</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <header class="dashboard-navbar">

        <div class="logo">
            Campus<span>Hire</span> AI
        </div>

        <div class="student-info">

            <span id="profileTopName">
                Student
            </span>

            <div class="student-avatar">
                👤
            </div>

        </div>

    </header>


    <!-- Profile Container -->

    <main class="profile-page">

        <div class="profile-title">

            <p class="dashboard-label">
                STUDENT PROFILE
            </p>

            <h1>
                Complete Your Profile
            </h1>

            <p>
                Add your details to receive better AI-powered
                job recommendations.
            </p>

        </div>


        <!-- Profile Form -->

        <section class="profile-form-card">

            <form id="profileForm">


                <!-- Personal Information -->

                <div class="profile-section">

                    <h2>
                        Personal Information
                    </h2>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="profileName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Email
                            </label>

                            <input
                                type="email"
                                id="profileEmail"
                                placeholder="Enter your email"
                                readonly
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter phone number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                placeholder="e.g. Noida, Delhi"
                            >

                        </div>

                    </div>

                </div>


                <!-- Education -->

                <div class="profile-section">

                    <h2>
                        Education
                    </h2>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>
                                College / University
                            </label>

                            <input
                                type="text"
                                id="college"
                                placeholder="Enter college name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Course
                            </label>

                            <select id="course">

                                <option value="">
                                    Select Course
                                </option>

                                <option value="BCA">
                                    BCA
                                </option>

                                <option value="MCA">
                                    MCA
                                </option>

                                <option value="B.Tech">
                                    B.Tech
                                </option>

                                <option value="M.Tech">
                                    M.Tech
                                </option>

                                <option value="B.Sc">
                                    B.Sc
                                </option>

                                <option value="M.Sc">
                                    M.Sc
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Graduation Year
                            </label>

                            <select id="graduationYear">

                                <option value="">
                                    Select Year
                                </option>

                                <option value="2026">
                                    2026
                                </option>

                                <option value="2027">
                                    2027
                                </option>

                                <option value="2028">
                                    2028
                                </option>

                                <option value="2029">
                                    2029
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                CGPA
                            </label>

                            <input
                                type="number"
                                id="cgpa"
                                placeholder="e.g. 8.2"
                                step="0.01"
                                min="0"
                                max="10"
                            >

                        </div>

                    </div>

                </div>


                <!-- Skills -->

                <div class="profile-section">

                    <h2>
                        Skills & Career
                    </h2>

                    <div class="form-grid">

                        <div class="form-group full-width">

                            <label>
                                Technical Skills
                            </label>

                            <input
                                type="text"
                                id="skills"
                                placeholder="e.g. HTML, CSS, JavaScript, Python, MySQL"
                            >

                            <small>
                                Separate skills using commas.
                            </small>

                        </div>


                        <div class="form-group">

                            <label>
                                Preferred Job Role
                            </label>

                            <select id="jobRole">

                                <option value="">
                                    Select Job Role
                                </option>

                                <option value="Frontend Developer">
                                    Frontend Developer
                                </option>

                                <option value="Backend Developer">
                                    Backend Developer
                                </option>

                                <option value="Full Stack Developer">
                                    Full Stack Developer
                                </option>

                                <option value="Web Developer">
                                    Web Developer
                                </option>

                                <option value="Data Analyst">
                                    Data Analyst
                                </option>

                                <option value="Software Developer">
                                    Software Developer
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Preferred Location
                            </label>

                            <input
                                type="text"
                                id="preferredLocation"
                                placeholder="e.g. Noida, Delhi, Gurugram"
                            >

                        </div>

                    </div>

                </div>


                <!-- Resume -->

                <div class="profile-section">

                    <h2>
                        Resume
                    </h2>

                    <div class="form-group">

                        <label>
                            Upload Resume
                        </label>

                        <input
                            type="file"
                            id="resume"
                            accept=".pdf,.doc,.docx"
                        >

                        <small>
                            PDF or Word document
                        </small>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="profile-actions">

                    <a
                        href="student-dashboard.html"
                        class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="profile-btn">

                        Save Profile

                    </button>

                </div>


            </form>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
